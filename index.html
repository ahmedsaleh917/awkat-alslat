<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d2d2d">
    <title>مواقيت الصلاة والطقس | صفاء الروح</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #2d2d2d;
            --primary-darker: #1a1a1a;
            --accent-gold: #f4d03f;
            --accent-gold-light: #ffd700;
            --card-bg: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; text-align: center; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; overflow-y: auto;
            min-height: 100vh;
            padding-bottom: 300px;
            color: var(--text-primary);
        }

        .top-header {
            background: linear-gradient(135deg, rgba(45, 45, 45, 0.98), rgba(26, 26, 26, 0.95));
            height: 160px; width: 100%;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-bottom: 2px solid var(--accent-gold);
        }
        .nav-bar { width: 90%; display: flex; justify-content: space-between; align-items: center; color: var(--accent-gold); }
        
        .header-title {
            font-weight: 900; font-size: 1.8rem; letter-spacing: 1px;
            color: var(--accent-gold); margin: 10px 0;
        }
        .main-container { 
            width: 92%; max-width: 480px; margin-top: 30px; 
            display: flex; flex-direction: column; gap: 15px; padding-bottom: 60px;
        }
        @media (min-width: 768px) {
            .main-container { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .countdown-timer, .info-card { grid-column: span 2; }
        }

        .info-card {
            background: var(--card-bg); padding: 20px; border-radius: 22px;
            box-shadow: var(--shadow); border-right: 6px solid var(--accent-gold);
        }
        
        .weather-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .weather-temp { font-size: 2rem; font-weight: 900; color: var(--accent-gold); }
        .weather-desc { font-size: 0.9rem; color: var(--text-secondary); }
        .city-text h2 { margin: 0 0 8px 0; color: var(--accent-gold); font-size: 1.3rem; }
        .city-text p { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }

        .selector-box {
            background: var(--card-bg); padding: 12px; border-radius: 15px;
            box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.1);
        }
        .selector-box select { 
            width: 100%; border: none; font-family: 'Tajawal'; font-weight: 800;
            outline: none; background: rgba(255,255,255,0.05); color: var(--text-primary);
            font-size: 1rem; cursor: pointer; padding: 10px; border-radius: 10px;
        }
        .selector-box select:focus { background: rgba(244, 208, 63, 0.1); }
        
        .countdown-timer {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-darker)); 
            color: var(--text-primary); padding: 20px; border-radius: 18px;
            text-align: center; border: 2px solid var(--accent-gold);
            box-shadow: 0 6px 15px rgba(244, 208, 63, 0.2);
        }
        .countdown-timer span#timer { color: var(--accent-gold); font-weight: 900; font-size: 1.6rem; }

        .prayer-list { display: flex; flex-direction: column; gap: 10px; }
        .prayer-item {
            background: var(--card-bg); padding: 15px 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2); cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;        }
        .prayer-item:hover { transform: translateX(5px); border-color: var(--accent-gold); }
        .prayer-item.active { 
            border: 2px solid var(--accent-gold);
            background: linear-gradient(135deg, rgba(244, 208, 63, 0.1), rgba(244, 208, 63, 0.05));
        }
        .prayer-name { font-weight: 800; color: var(--accent-gold); font-size: 1rem; }
        .prayer-time { font-weight: 900; color: var(--text-primary); font-size: 1.1rem; }

        .fixed-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(45, 45, 45, 0.98);
            backdrop-filter: blur(15px);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
            padding: 15px; z-index: 1000;
            border-top: 3px solid var(--accent-gold);
        }
        .controls-grid {
            max-width: 900px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .control-btn {
            background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Tajawal'; font-weight: 700;
            color: var(--text-primary); cursor: pointer;
            font-size: 0.85rem; transition: all 0.3s;
        }
        .control-btn.active {
            background: var(--accent-gold); color: var(--primary-darker);
            border-color: var(--accent-gold);
        }
        .control-btn:hover { transform: translateY(-2px); }

        .muezzin-toggle {
            display: none; align-items: center; justify-content: center;
            gap: 12px; padding: 10px; margin-top: 10px;
            background: rgba(255,255,255,0.05); border-radius: 12px;
        }
        .toggle-switch {
            position: relative; width: 50px; height: 28px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; border-radius: 28px;
            transition: 0.3s;        }
        .toggle-slider:before {
            position: absolute; content: "";
            height: 22px; width: 22px; left: 3px; bottom: 3px;
            background-color: white; border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .toggle-slider { background-color: var(--accent-gold); }
        input:checked + .toggle-slider:before { transform: translateX(22px); }

        .muezzin-select {
            flex: 1; padding: 10px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; font-family: 'Tajawal'; font-weight: 700;
            color: var(--text-primary); background: var(--card-bg);
        }

        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--card-bg); padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-right: 4px solid var(--accent-gold);
            z-index: 2000; font-weight: 600; color: var(--text-primary);
            transition: transform 0.4s; max-width: 90%;
        }
        .notification.show { transform: translateX(-50%) translateY(0); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); width: 85%; max-width: 350px; border-radius: 25px; 
            padding: 30px; text-align: center; border-top: 8px solid var(--accent-gold);
        }

        .location-status {
            font-size: 0.75rem; color: var(--accent-gold);
            text-align: center; margin: 8px auto 0;
            display: none; align-items: center; justify-content: center; gap: 6px;
            background: rgba(244, 208, 63, 0.15); padding: 4px 10px; border-radius: 20px;
            width: fit-content;
        }
        .location-status i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #adhan-audio { display: none; }
    </style>
</head>

<script>
// ⚙️ إعدادات التطبيق
const API_KEY_WEATHER = "a51243f7648b764f71f76f6cac8f9995";

// 🎙️ روابط الأذان
const MUEZZIN_SOURCES = {
    qatami: "https://server8.mp3quran.net/atha/Ar-001.mp3",
    alafasy: "https://server7.mp3quran.net/afs/Ar-001.mp3",
    sudais: "https://server11.mp3quran.net/sds/Ar-001.mp3"
};

// 📝 وصف المدن
const cityDescriptions = {
    "Abha,SA": "لؤلؤة الجنوب الباسمة، حيث الجبال الخضراء تلامس السحاب",
    "Al-Dayer,SA": "واحة الجمال بين الجبال الشاهقة",
    "Hawf,YE": "بوابة اليمن الشرقية، حيث تلتقي الصحراء بالبحر",
    "Ibb,YE": "جنة اليمن الفيحاء، تكتسي خضرة دائمة",
    "Socotra,YE": "جنة الأرض المنعزلة، موطن شجرة الدموع",
    "Salalah,OM": "عروس الخريف العربي، حيث الضباب يحتضن الجبال",
    "Makkah,SA": "قبلة المسلمين ومهبط الوحي",
    "Madinah,SA": "طيبة الطيبة، مهاجر النبي ﷺ",    "Jerusalem,PS": "أولى القبلتين وثالث الحرمين",
    "Ataq,YE": "قلب شبوة النابض، أرض الكرم والشهامة",
    "Aden,YE": "ثغر اليمن الباسم، مدينة الحب والتعايش",
    "Sanaa,YE": "صنعاء القديمة، مهد الحضارة",
    "Mukalla,YE": "عروس حضرموت الساحلية",
    "Taiz,YE": "عروس الجبل، مدينة العلم والأدب",
    "Marib,YE": "مهد الحضارة اليمنية، أرض بلقيس",
    "Al Hudaydah,YE": "ميناء اليمن الغربي، بوابة الخير",
    "Al Mahrah,YE": "أرض اللبان والعنبر",
    "Saada,YE": "منارة الشمال اليمني",
    "Dhamar,YE": "حاضرة العلم والعرفة"
};

let prayerTimes = {};
let hasNotified = {};
let adhanEnabled = false;
let notificationsEnabled = true;
let currentMuezzin = 'qatami';

function showNotification(msg) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 3000);
}

// البحث عن المدينة
function findCityInList(detectedCity, detectedCountry) {
    const options = Array.from(document.getElementById('city-select').options);
    for (let opt of options) {
        const [city, country] = opt.value.split(',');
        if (country === detectedCountry) {
            if (city.toLowerCase().includes(detectedCity.toLowerCase()) || 
                detectedCity.toLowerCase().includes(city.toLowerCase())) {
                return opt.value;
            }
        }
    }
    return null;
}

// تحديد الموقع
async function detectUserLocation() {
    return new Promise((resolve) => {
        const locStatus = document.getElementById('loc-status');
        const locText = document.getElementById('loc-text');
        locStatus.style.display = 'flex';

        if ("geolocation" in navigator) {
            locText.textContent = "📍 جاري البحث عبر GPS...";            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=ar`, { 
                            headers: { 'User-Agent': 'SafaaAlRouhApp/1.0' } 
                        });
                        const data = await res.json();
                        const city = data.address?.city || data.address?.town || data.address?.village || data.address?.state;
                        const country = data.address?.country_code?.toUpperCase();
                        const match = city && country ? findCityInList(city, country) : null;
                        if (match) { 
                            resolve(match); 
                            return; 
                        }
                    } catch(e) { 
                        console.log('GPS failed'); 
                    }
                    fallbackToIP(resolve);
                },
                () => { 
                    locText.textContent = "⏳ GPS غير متاح"; 
                    fallbackToIP(resolve); 
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
            );
        } else {
            fallbackToIP(resolve);
        }
    });
}

async function fallbackToIP(resolve) {
    try {
        document.getElementById('loc-text').textContent = "🌐 البحث عبر الشبكة...";
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        const options = Array.from(document.getElementById('city-select').options);
        const match = options.find(opt => {
            const [c] = opt.value.split(',');
            return c.toLowerCase().includes(data.city?.toLowerCase()) || data.city?.toLowerCase().includes(c.toLowerCase());
        });
        resolve(match ? match.value : null);
    } catch { 
        resolve(null); 
    } finally { 
        document.getElementById('loc-status').style.display = 'none'; 
    }
}

// جلب الطقسasync function getWeather(city) {
    try {
        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY_WEATHER}&units=metric&lang=ar`);
        if (!res.ok) throw new Error();
        return await res.json();
    } catch {
        return null;
    }
}

// جلب مواقيت الصلاة
async function getPrayerTimes(city, country) {
    try {
        const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=4`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        return data.data;
    } catch {
        return null;
    }
}

// تحديث الواجهة
function updateUI(cityKey, data) {
    if (!data) return;
    
    prayerTimes = data.timings;
    const date = data.date;
    
    // التاريخ
    document.getElementById('header-date').textContent = `${date.hijri.day} ${date.hijri.month.ar} ${date.hijri.year}`;
    document.getElementById('modal-hijri').textContent = `${date.hijri.day} ${date.hijri.month.ar} ${date.hijri.year}`;
    document.getElementById('modal-greg').textContent = `${date.gregorian.day} ${date.gregorian.month.en} ${date.gregorian.year}`;
    
    // اسم المدينة
    const select = document.getElementById('city-select');
    const txt = select.options[select.selectedIndex].text.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').trim();
    document.getElementById('info-name').textContent = `مواقيت ${txt}`;
    document.getElementById('info-desc').textContent = cityDescriptions[cityKey] || "مدينة عربية كريمة";
    
    renderPrayers();
    updateCountdown();
}

// عرض الصلوات
function renderPrayers() {
    const list = document.getElementById('prayer-list');
    list.innerHTML = '';
    
    const prayers = {        'Fajr': 'الفجر',
        'Dhuhr': 'الظهر',
        'Asr': 'العصر',
        'Maghrib': 'المغرب',
        'Isha': 'العشاء'
    };
    
    const now = new Date();
    const currentHour = now.getHours();
    const currentMinute = now.getMinutes();
    
    for (let [key, name] of Object.entries(prayers)) {
        if (!prayerTimes[key]) continue;
        
        const time = prayerTimes[key];
        const [h, m] = time.split(':');
        const prayerHour = parseInt(h);
        const prayerMinute = parseInt(m);
        
        const item = document.createElement('div');
        item.className = 'prayer-item';
        
        if (Math.abs(prayerHour - currentHour) <= 1 && Math.abs(prayerMinute - currentMinute) <= 30) {
            item.classList.add('active');
        }
        
        const period = prayerHour >= 12 ? 'م' : 'ص';
        const hour12 = prayerHour % 12 || 12;
        const time12 = `${hour12}:${prayerMinute.toString().padStart(2,'0')} ${period}`;
        
        item.innerHTML = `
            <span class="prayer-name">${name}</span>
            <span class="prayer-time">${time12}</span>
        `;
        list.appendChild(item);
    }
}

// العد التنازلي
function updateCountdown() {
    if (!prayerTimes.Fajr) return;
    
    const now = new Date();
    const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    let nextPrayer = null;
    let nextTime = null;
    
    for (let prayer of prayers) {
        const [h, m] = prayerTimes[prayer].split(':');
        const prayerDate = new Date();        prayerDate.setHours(parseInt(h), parseInt(m), 0);
        
        if (prayerDate > now) {
            nextPrayer = prayer;
            nextTime = prayerDate;
            break;
        }
    }
    
    if (!nextPrayer) {
        const [h, m] = prayerTimes['Fajr'].split(':');
        nextTime = new Date();
        nextTime.setDate(nextTime.getDate() + 1);
        nextTime.setHours(parseInt(h), parseInt(m), 0);
        nextPrayer = 'Fajr';
    }
    
    const diff = nextTime - now;
    const hours = Math.floor(diff / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    document.getElementById('timer').textContent = 
        `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    
    const names = {'Fajr':'الفجر','Dhuhr':'الظهر','Asr':'العصر','Maghrib':'المغرب','Isha':'العشاء'};
    document.getElementById('next-p-name').textContent = names[nextPrayer];
    
    if (diff <= 0 && diff > -30000 && adhanEnabled && !hasNotified[nextPrayer]) {
        playAdhan(names[nextPrayer]);
        hasNotified[nextPrayer] = true;
    }
}

// تشغيل الأذان
function playAdhan(prayerName) {
    if (!adhanEnabled) return;
    
    const audio = document.getElementById('adhan-audio');
    audio.src = MUEZZIN_SOURCES[currentMuezzin];
    audio.volume = 0.7;
    audio.play().catch(e => console.log('Audio error:', e));
    
    showNotification(`🕌 حان وقت صلاة ${prayerName}`);
    
    setTimeout(() => {
        audio.pause();
        audio.currentTime = 0;
    }, 90000);
}
// تحميل البيانات
async function loadData() {
    const select = document.getElementById('city-select');
    const [city, country] = select.value.split(',');
    
    showNotification('جاري تحميل البيانات...');
    
    // جلب الطقس
    const weather = await getWeather(city);
    if (weather) {
        document.getElementById('w-temp').textContent = Math.round(weather.main.temp) + "°";
        document.getElementById('w-desc').textContent = weather.weather[0].description;
    } else {
        document.getElementById('w-desc').textContent = "غير متاح";
    }
    
    // جلب المواقيت
    const data = await getPrayerTimes(city, country);
    if (data) {
        updateUI(select.value, data);
        showNotification('✅ تم التحميل بنجاح');
    } else {
        showNotification('⚠️ خطأ في التحميل');
    }
}

// التحكم
function toggleNotifications() {
    notificationsEnabled = !notificationsEnabled;
    document.getElementById('btn-notif').classList.toggle('active', notificationsEnabled);
    showNotification(notificationsEnabled ? '✅ تم تفعيل التنبيهات' : '❌ تم إيقاف التنبيهات');
}

function toggleAdhan() {
    adhanEnabled = !adhanEnabled;
    document.getElementById('btn-adhan').classList.toggle('active', adhanEnabled);
    document.getElementById('muezzin-panel').style.display = adhanEnabled ? 'flex' : 'none';
    document.getElementById('adhan-toggle').checked = adhanEnabled;
    showNotification(adhanEnabled ? '✅ تم تفعيل الأذان' : '❌ تم إيقاف الأذان');
}

function toggleAdhanPlayback() {
    adhanEnabled = document.getElementById('adhan-toggle').checked;
    document.getElementById('btn-adhan').classList.toggle('active', adhanEnabled);
}

function changeMuezzin() {
    currentMuezzin = document.getElementById('muezzin-select').value;
    showNotification('✅ تم تغيير المؤذن');}

// الأحداث
document.getElementById('city-select').addEventListener('change', loadData);
document.getElementById('open-cal').addEventListener('click', () => {
    document.getElementById('cal-modal').classList.add('active');
});

// البدء
window.addEventListener('load', async () => {
    const savedCity = localStorage.getItem('userCity');
    if (savedCity) {
        document.getElementById('city-select').value = savedCity;
    } else {
        const detected = await detectUserLocation();
        if (detected) {
            document.getElementById('city-select').value = detected;
            showNotification(`🎯 تم تحديد: ${document.getElementById('city-select').selectedOptions[0].text}`);
        }
    }
    
    loadData();
    setInterval(updateCountdown, 1000);
    
    setInterval(() => {
        hasNotified = {};
    }, 86400000);
});

document.getElementById('city-select').addEventListener('change', () => {
    localStorage.setItem('userCity', document.getElementById('city-select').value);
});
</script>
