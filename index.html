<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مواقيت الصلاة والطقس | صفاء الروح</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #1e4d2b;
            --accent-gold: #d4af37;
            --bg-light: #f4f7f6;
            --shadow: 0 10px 25px rgba(0,0,0,0.06);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-light); 
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            padding-bottom: 160px; /* مساحة للوحة التحكم الثابتة */
        }

        .top-header {
            background: linear-gradient(135deg, var(--primary-green), #0d2818);
            height: 180px; width: 100%; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .nav-bar { width: 90%; display: flex; justify-content: space-between; align-items: center; color: white; }
        .logo-box {
            position: absolute; bottom: -35px; width: 80px; height: 80px;
            background: white; border-radius: 50%; padding: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 5;
            border: 3px solid var(--accent-gold);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6); }
        }
        .logo-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* 🎯 تصميم متجاوب ذكي حتى 900px */        .main-container { 
            width: 92%; max-width: 480px; margin-top: 45px; 
            display: flex; flex-direction: column; gap: 15px; 
            padding-bottom: 20px;
        }
        @media (min-width: 768px) {
            .main-container { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .countdown-timer, .info-card { grid-column: span 2; }
            .prayer-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); grid-column: span 2; }
        }

        .info-card {
            background: white; padding: 20px; border-radius: 22px;
            box-shadow: var(--shadow); border-right: 6px solid var(--accent-gold);
            transition: var(--transition);
        }
        .info-card:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        
        .weather-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #eee;
        }
        .weather-temp { font-size: 1.8rem; font-weight: 900; color: var(--primary-green); }
        .weather-desc { font-size: 0.85rem; color: #666; font-weight: 500; }

        .city-text h2 { margin: 0 0 8px 0; color: var(--primary-green); font-size: 1.3rem; font-weight: 900; }
        .city-text p { font-size: 0.88rem; color: #555; line-height: 1.6; }

        .selector-box {
            background: white; padding: 12px; border-radius: 15px;
            box-shadow: var(--shadow); border: 1px solid #efefef;
        }
        .selector-box select { 
            width: 100%; border: none; font-family: 'Tajawal'; 
            font-weight: 800; outline: none; background: #f9f9f9; 
            color: var(--primary-green); font-size: 1rem; cursor: pointer;
            padding: 10px; border-radius: 10px;
            transition: var(--transition);
        }
        .selector-box select:focus { background: #f0f7f2; box-shadow: 0 0 0 3px rgba(30, 77, 43, 0.1); }

        .countdown-timer {
            background: var(--primary-green); color: white; padding: 15px; border-radius: 18px;
            text-align: center; border: 2px solid var(--accent-gold);
            box-shadow: 0 6px 15px rgba(30, 77, 43, 0.2);
            position: relative; overflow: hidden;
        }
        .countdown-timer::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 100% { left: 100%; } }
        .countdown-timer span#timer { color: var(--accent-gold); font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }

        .prayer-list { display: flex; flex-direction: column; gap: 10px; }
        .prayer-item {
            background: white; padding: 15px 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03); transition: var(--transition);
            cursor: pointer;
        }
        .prayer-item:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .prayer-item.active { 
            border: 2px solid var(--accent-gold); 
            background: linear-gradient(135deg, #f0f7f2, #e8f5e9); 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        .prayer-name { font-weight: 800; color: var(--primary-green); font-size: 1rem; }
        .prayer-time { font-weight: 900; color: #333; font-size: 1.1rem; }

        /* 🎛️ لوحة التحكم الثابتة أسفل الشاشة */
        .fixed-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
            padding: 12px 15px; z-index: 1000;
            border-top: 2px solid var(--accent-gold);
        }
        .controls-grid {
            max-width: 900px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;
            margin-bottom: 6px;
        }
        @media (max-width: 480px) { .controls-grid { grid-template-columns: 1fr 1fr; } }

        .control-btn {
            background: white; border: 2px solid #e0e0e0;
            padding: 11px 10px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Tajawal'; font-weight: 700;
            color: var(--primary-green); cursor: pointer;
            transition: var(--transition); font-size: 0.85rem;
        }
        .control-btn.active {
            background: var(--primary-green); color: white;
            border-color: var(--accent-gold);
            box-shadow: 0 4px 12px rgba(30, 77, 43, 0.3);
        }        .control-btn i { font-size: 1rem; }
        .control-btn:hover { transform: translateY(-2px); }

        .voice-select {
            grid-column: 1 / -1;
            background: white; border: 2px solid #e0e0e0;
            padding: 10px 15px; border-radius: 12px;
            font-family: 'Tajawal'; font-weight: 700;
            color: var(--primary-green); cursor: pointer;
            transition: var(--transition); font-size: 0.9rem;
            width: 100%; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e4d2b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 10px center;
            background-size: 16px;
        }
        .voice-select:focus { border-color: var(--accent-gold); outline: none; }

        .note-text {
            font-size: 0.72rem; color: #666; text-align: center;
            padding: 6px 10px; background: #f9f9f9;
            border-radius: 8px; margin-top: 4px;
        }

        .sound-toggle {
            position: fixed; bottom: 150px; left: 20px;
            background: var(--primary-green); color: white;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 1001; 
            border: 2px solid var(--accent-gold);
            transition: var(--transition); cursor: pointer;
        }
        .sound-toggle:hover { transform: scale(1.1); }
        .sound-toggle.muted { background: #666; }

        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: white; padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-right: 4px solid var(--accent-gold);
            z-index: 2000; font-weight: 600; color: var(--primary-green);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%; text-align: center;
        }
        .notification.show { transform: translateX(-50%) translateY(0); }
        .notification.adhan { 
            background: linear-gradient(135deg, var(--primary-green), #0d2818); 
            color: white; border-color: var(--accent-gold); 
        }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content { 
            background: white; width: 85%; max-width: 320px; border-radius: 25px; 
            padding: 30px; text-align: center; border-top: 8px solid var(--accent-gold);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .location-status {
            font-size: 0.72rem; color: var(--accent-gold);
            text-align: center; margin: 8px auto 0;
            display: none; align-items: center; justify-content: center; gap: 6px;
            background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 20px;
            width: fit-content;
        }
        .location-status i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="notification" id="notification"></div>

<div class="top-header">
    <div class="nav-bar">
        <i class="fas fa-location-dot"></i>
        <h1 style="font-weight: 900; font-size: 1.3rem; letter-spacing: 1px;">صفاء الروح</h1>
        <i class="fas fa-calendar-days" id="open-cal" style="cursor:pointer;"></i>
    </div>
    <div id="header-date" style="color: white; opacity: 0.9; margin-top: 10px; font-family:'Amiri'; font-size: 1.1rem;">--</div>
    <div class="location-status" id="loc-status">
        <i class="fas fa-satellite-dish"></i>

    </div>
    <div class="logo-box">
        <img src="https://i.postimg.cc/zGSvxgCn/1775323811617.png" alt="Logo">
    </div>
</div>

<div class="main-container">
    <div class="info-card">
        <div class="weather-section" id="weather-box">            <div>
                <div class="weather-temp" id="w-temp">--°</div>
                <div class="weather-desc" id="w-desc">جاري جلب الطقس...</div>

    <div class="selector-box">
        <select id="city-select">
            <optgroup label="✨ مدن سياحية جديدة">
                <option value="Abha,SA">أبها - عسير 🇸🇦</option>

                <option value="Mukalla,YE">المكلا</option>

                <option value="Marib,YE">مأرب</option>
                <option value="Al Hudaydah,YE">الحديدة</option>
                <option value="Al Mahrah,YE">المهرة</option>
                <option value="Saada,YE">صعدة</option>
                <option value="Dhamar,YE">ذمار</option>
            </optgroup>
            <optgroup label="🌍 العواصم العربية">
                <option value="Riyadh,SA">الرياض</option>
                <option value="Cairo,EG">القاهرة</option>
                <option value="Abu Dhabi,AE">أبوظبي</option>
                <option value="Kuwait,KW">الكويت</option>
                <option value="Doha,QA">الدوحة</option>

                <option value="Manama,BH">المنامة</option>
                <option value="Amman,JO">عمان</option>
                <option value="Beirut,LB">بيروت</option>
                <option value="Damascus,SY">دمشق</option>                <option value="Baghdad,IQ">بغداد</option>
                <option value="Khartoum,SD">الخرطوم</option>
                <option value="Tripoli,LY">طرابلس</option>
                <option value="Tunis,TN">تونس</option>
                <option value="Algiers,DZ">الجزائر</option>
                <option value="Rabat,MA">الرباط</option>
            </optgroup>
        </select>
    </div>

    <div class="countdown-timer">
        باقي على صلاة <span id="next-p-name">--</span>
        <br>
        <span id="timer">00:00:00</span>
    </div>

    <div class="prayer-list" id="prayer-list"></div>
</div>

<div class="modal" id="cal-modal">
    <div class="modal-content">
        <div style="margin-bottom:15px;">
            <span style="color:#888; font-size:0.8rem;">التاريخ الهجري</span>
            <div id="modal-hijri" style="font-size:1.4rem; font-weight:900; color:var(--primary-green); font-family:'Amiri';"></div>
        </div>
        <div style="margin-bottom:20px;">
            <span style="color:#888; font-size:0.8rem;">التاريخ الميلادي</span>
            <div id="modal-greg" style="font-weight:700; color:#444;"></div>
        </div>
        <button onclick="document.getElementById('cal-modal').classList.remove('active')" style="background:var(--primary-green); color:white; border:none; padding:12px 40px; border-radius:12px; font-weight:bold; cursor:pointer;">إغلاق</button>
    </div>
</div>

<!-- 🎛️ لوحة التحكم الثابتة أسفل الشاشة -->
<div class="fixed-controls">
    <div class="controls-grid">
        <button class="control-btn active" id="adhan-toggle">
            <i class="fas fa-bell"></i>
            <span>تفعيل المؤذن</span>
        </button>
        <button class="control-btn active" id="sound-toggle">
            <i class="fas fa-volume-up"></i>
            <span>صوت الأذان</span>
        </button>
        <select id="adhan-voice" class="voice-select">
            <option value="qatami">🎤 الشيخ ناصر القطامي (مفضل)</option>
            <option value="sudais">🎤 الشيخ عبد الرحمن السديس</option>
            <option value="basit">🎤 الشيخ عبد الباسط عبد الصمد</option>
            <option value="hussary">🎤 الشيخ محمود خليل الحصري</option>
            <option value="default">🎤 المؤذن الافتراضي</option>        </select>
    </div>
    <div class="note-text">
        💡 يمكنك إيقاف الأذان بزر خفض الصوت أو إغلاق الشاشة/تبويب التطبيق
    </div>
</div>

<div class="sound-toggle" id="sound-btn">
    <i class="fas fa-volume-up" id="sound-icon"></i>
</div>

<script>
    const API_KEY_WEATHER = "a51243f7648b764f71f76f6cac8f9995";
    
    // 🎙️ مكتبة أصوات الأذان الموثوقة (روابط مباشرة لملفات MP3)
    const adhanVoices = {
        qatami: "https://server10.mp3quran.net/qtm/adhan.mp3",
        sudais: "https://server8.mp3quran.net/sds/adhan.mp3",
        basit: "https://server7.mp3quran.net/basit/adhan.mp3",
        hussary: "https://server11.mp3quran.net/husr/adhan.mp3",
        default: "https://www.islamcan.com/common/adhan/adhan1.mp3"
    };

    let currentVoice = localStorage.getItem('adhanVoice') || 'qatami';
    let adhanAudio = new Audio(adhanVoices[currentVoice]);
    adhanAudio.preload = 'auto';

    // 🛡️ حماية ذكية: إذا تعطل أي رابط، ينتقل تلقائياً للافتراضي
    adhanAudio.addEventListener('error', () => {
        console.log("⚠️ رابط المؤذن غير متاح، التبديل الآمن...");
        adhanAudio.src = adhanVoices.default;
        adhanAudio.load();
    });

    document.getElementById('adhan-voice').value = currentVoice;

    const cityDescriptions = {
        "Abha,SA": "لؤلؤة الجنوب الباسمة، حيث الجبال الخضراء تلامس السحاب والهواء العليل يبعث الحياة في كل نفس",
        "Al-Dayer,SA": "واحة الجمال بين الجبال الشاهقة، وشواهد التاريخ تحكي عراقة الأجداد وكرم الضيافة",
        "Hawf,YE": "بوابة اليمن الشرقية، حيث تلتقي رمال الصحراء بزرقة البحر في لوحة خلابة تأخذ بالألباب",
        "Ibb,YE": "جنة اليمن الفيحاء، تكتسي خضرةً دائمةً وتزهو بمدرجاتها الزراعية الساحرة وعيونها الجارية",
        "Socotra,YE": "جنة الأرض المنعزلة، موطن شجرة الدموع وأندر الكائنات في أرخبيل أسطوري يأسر الخيال",
        "Salalah,OM": "عروس الخريف العربي، حيث الضباب يحتضن الجبال والورد يفوح شذىً في كل مكان",
        "Makkah,SA": "قبلة المسلمين ومهبط الوحي، مدينة الأمان والطمأنينة",
        "Madinah,SA": "طيبة الطيبة، مهاجر النبي ﷺ ودار السكينة والأنوار",
        "Jerusalem,PS": "أولى القبلتين وثالث الحرمين الشريفين، رمز الصمود والعزة",
        "Ataq,YE": "قلب شبوة النابض، أرض الكرم والشهامة والأصالة التاريخية",
        "Aden,YE": "ثغر اليمن الباسم، مدينة الحب والتعايش والتاريخ البحري العريق",
        "Sanaa,YE": "صنعاء القديمة، مهد الحضارة وفن العمارة الفريد والجمال الخالد",
        "Mukalla,YE": "عروس حضرموت الساحلية، حيث الأصالة تمزج بين البحر والتراث",        "Taiz,YE": "عروس الجبل، مدينة العلم والأدب وجمال الطبيعة الخلابة",
        "Marib,YE": "مهد الحضارة اليمنية، أرض بلقيس وسد مأرب التاريخي العظيم",
        "Al Hudaydah,YE": "ميناء اليمن الغربي، بوابة الخير وعنوان الكرم الساحلي",
        "Al Mahrah,YE": "أرض اللبان والعنبر، حيث الصحراء تلتقي بالبحر في تناغم ساحر",
        "Saada,YE": "منارة الشمال اليمني، أرض العزة والشموخ والتاريخ الأصيل",
        "Dhamar,YE": "حاضرة العلم والعرفة، واحة الخضرة بين جبال اليمن الشاهقة"
    };

    let prayerTimes = {};
    let isAdhanEnabled = true;
    let isSoundOn = true;
    let hasAdhanPlayed = { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false };
    let adhanTimeout = null;

    function updateAdhanVoice() {
        const newSrc = adhanVoices[currentVoice];
        if (!newSrc) return;
        adhanAudio.pause();
        adhanAudio.src = newSrc;
        adhanAudio.load();
        if (isSoundOn) { adhanAudio.play().then(() => adhanAudio.pause()).catch(()=>{}); }
    }

    function showNotification(message, type = 'info') {
        const notif = document.getElementById('notification');
        notif.textContent = message;
        notif.className = `notification ${type} show`;
        setTimeout(() => notif.classList.remove('show'), 4500);
    }

    function playAdhan(prayerName) {
        if (!isAdhanEnabled || !isSoundOn || hasAdhanPlayed[prayerName]) return;
        
        showNotification(`🕌 حان وقت صلاة ${prayerName}`, 'adhan');
        adhanAudio.play().then(() => {
            hasAdhanPlayed[prayerName] = true;
            showNotification(`🔊 جاري تشغيل الأذان: ${prayerName}`, 'adhan');
        }).catch(() => {
            showNotification('🔕 يرجى التفاعل مع الصفحة أولاً لتفعيل الصوت', 'info');
        });
    }

    function stopAdhan() {
        adhanAudio.pause();
        adhanAudio.currentTime = 0;
        showNotification('🔇 تم إيقاف الأذان', 'info');
    }

    function findCityInList(detectedCity, detectedCountry) {
        const options = Array.from(document.getElementById('city-select').options);        for (let opt of options) {
            const [city, country] = opt.value.split(',');
            if (country === detectedCountry) {
                if (city.toLowerCase().includes(detectedCity.toLowerCase()) || 
                    detectedCity.toLowerCase().includes(city.toLowerCase())) {
                    return opt.value;
                }
            }
        }
        const fallback = {
            'mecca':'Makkah,SA','makkah':'Makkah,SA','medina':'Madinah,SA','madinah':'Madinah,SA',
            'sana':'Sanaa,YE','sanaa':'Sanaa,YE','aden':'Aden,YE','riyadh':'Riyadh,SA',
            'cairo':'Cairo,EG','abha':'Abha,SA','salalah':'Salalah,OM','socotra':'Socotra,YE','ibb':'Ibb,YE'
        };
        const key = detectedCity.toLowerCase().replace(/[^a-z]/g, '');
        return fallback[key] || null;
    }

    async function detectUserLocation() {
        return new Promise((resolve) => {
            const locStatus = document.getElementById('loc-status');
            const locText = document.getElementById('loc-text');
            locStatus.style.display = 'flex';

            if ("geolocation" in navigator) {
                locText.textContent = "📍 جاري البحث عبر GPS...";
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=ar`, { headers: { 'User-Agent': 'SafaaAlRouhApp/1.0' } });
                            const data = await res.json();
                            const city = data.address?.city || data.address?.town || data.address?.village || data.address?.state;
                            const country = data.address?.country_code?.toUpperCase();
                            const match = city && country ? findCityInList(city, country) : null;
                            if (match) { resolve(match); return; }
                        } catch(e) { console.log('GPS Geocoding failed'); }
                        fallbackToIP(resolve);
                    },
                    () => { locText.textContent = "⏳ GPS غير متاح، التحويل للإنترنت..."; fallbackToIP(resolve); },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
                );
            } else {
                fallbackToIP(resolve);
            }
        });
    }

    async function fallbackToIP(resolve) {
        try {
            document.getElementById('loc-text').textContent = "🌐 البحث عبر الشبكة...";            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            const options = Array.from(document.getElementById('city-select').options);
            const match = options.find(opt => {
                const [c] = opt.value.split(',');
                return c.toLowerCase().includes(data.city?.toLowerCase()) || data.city?.toLowerCase().includes(c.toLowerCase());
            });
            resolve(match ? match.value : null);
        } catch { resolve(null); }
        finally { document.getElementById('loc-status').style.display = 'none'; }
    }

    async function init() {
        const savedCity = localStorage.getItem('userCity');
        const savedAdhan = localStorage.getItem('adhanEnabled');
        const savedSound = localStorage.getItem('soundEnabled');

        if (savedAdhan !== null) {
            isAdhanEnabled = savedAdhan === 'true';
            document.getElementById('adhan-toggle').classList.toggle('active', isAdhanEnabled);
        }
        if (savedSound !== null) {
            isSoundOn = savedSound === 'true';
            document.getElementById('sound-toggle').classList.toggle('active', isSoundOn);
            updateSoundIcon();
        }

        let cityToLoad = savedCity;
        if (!cityToLoad) {
            cityToLoad = await detectUserLocation();
        }

        if (cityToLoad) {
            document.getElementById('city-select').value = cityToLoad;
            if (!savedCity) showNotification(`🎯 تم تحديد: ${document.getElementById('city-select').selectedOptions[0].text}`, 'info');
        } else {
            document.getElementById('city-select').value = "Makkah,SA";
            showNotification('🕋 العرض الافتراضي: مكة المكرمة', 'info');
        }
        getData();
    }

    async function getData() {
        const select = document.getElementById('city-select');
        const cityVal = select.value;
        localStorage.setItem('userCity', cityVal);
        hasAdhanPlayed = { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false };
        adhanTimeout = null;

        const [city, country] = cityVal.split(',');
        try {
            const wRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY_WEATHER}&units=metric&lang=ar`);
            if (!wRes.ok) throw new Error();
            const wData = await wRes.json();
            document.getElementById('w-temp').innerText = Math.round(wData.main.temp) + "°";
            document.getElementById('w-desc').innerText = wData.weather[0].description;
            document.getElementById('w-icon').innerHTML = `<img src="https://openweathermap.org/img/wn/${wData.weather[0].icon}@2x.png" width="50" alt="طقس">`;
        } catch { document.getElementById('w-desc').innerText = "⚠️ الطقس غير متاح"; }

        try {
            const pRes = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=4`);
            if (!pRes.ok) throw new Error();
            const pData = await pRes.json();
            prayerTimes = pData.data.timings;
            updateUI(cityVal, pData.data.date);
            renderPrayers();
        } catch { showNotification('⚠️ تعذر جلب المواقيت', 'info'); }
    }

    function updateUI(cityKey, dateData) {
        const select = document.getElementById('city-select');
        const txt = select.options[select.selectedIndex].text.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').trim();
        document.getElementById('info-name').innerText = "مواقيت " + txt;
        document.getElementById('info-desc').innerText = cityDescriptions[cityKey] || "مدينة عربية كريمة نعتز بها.";
        document.getElementById('header-date').innerText = `${dateData.hijri.day} ${dateData.hijri.month.ar} ${dateData.hijri.year}`;
        document.getElementById('modal-hijri').innerText = document.getElementById('header-date').innerText;
        document.getElementById('modal-greg').innerText = dateData.gregorian.date;
    }

    function renderPrayers() {
        const list = document.getElementById('prayer-list');
        const names = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
        list.innerHTML = "";
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();

        Object.keys(names).forEach(key => {
            const item = document.createElement('div');
            item.className = 'prayer-item';
            const [h, m] = prayerTimes[key].split(':');
            const pMin = parseInt(h) * 60 + parseInt(m);
            if (Math.abs(pMin - currentMin) <= 30) item.classList.add('active');
            item.innerHTML = `<span class="prayer-name">${names[key]}</span><span class="prayer-time">${format12Time(prayerTimes[key])}</span>`;
            list.appendChild(item);
        });
    }

    function format12Time(t) {
        let [h, m] = t.split(':'); h = parseInt(h);        return `${h % 12 || 12}:${m} ${h >= 12 ? "م" : "ص"}`;
    }

    function checkAdhanTrigger(nextName, diff) {
        if (diff <= 0 && diff > -60 && isAdhanEnabled && !hasAdhanPlayed[nextName]) {
            playAdhan(nextName);
        }
        if (diff > 0 && diff <= 120000 && isAdhanEnabled && !adhanTimeout) {
            adhanTimeout = setTimeout(() => {
                const names = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
                showNotification(`⏰ باقي دقيقتان على ${names[nextName]}`, 'info');
                adhanTimeout = null;
            }, diff - 120000);
        }
    }

    function updateCountdown() {
        if (!prayerTimes.Fajr) return;
        const now = new Date();
        const prayers = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        let next = null;
        for (let p of prayers) {
            const [h, m] = prayerTimes[p].split(':');
            const pTime = new Date(); pTime.setHours(h, m, 0);
            if (pTime > now) { next = { name: p, time: pTime }; break; }
        }
        if (!next) {
            const [h, m] = prayerTimes["Fajr"].split(':');
            const pTime = new Date(); pTime.setDate(pTime.getDate() + 1); pTime.setHours(h, m, 0);
            next = { name: "Fajr", time: pTime };
        }

        const diff = next.time - now;
        checkAdhanTrigger(next.name, diff);

        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        document.getElementById('next-p-name').innerText = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" }[next.name];
    }

    function updateSoundIcon() {
        const icon = document.getElementById('sound-icon');
        const btn = document.getElementById('sound-btn');
        icon.className = isSoundOn ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        btn.classList.toggle('muted', !isSoundOn);
    }

    document.addEventListener('visibilitychange', () => {        if (document.hidden && !adhanAudio.paused) stopAdhan();
    });

    function resetDailyFlags() {
        const now = new Date();
        if (now.getHours() === 0 && now.getMinutes() === 0) {
            hasAdhanPlayed = { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false };
            adhanTimeout = null;
        }
        setTimeout(resetDailyFlags, 60000);
    }

    document.getElementById('city-select').onchange = getData;
    document.getElementById('open-cal').onclick = () => document.getElementById('cal-modal').classList.add('active');
    document.getElementById('adhan-toggle').onclick = function() {
        isAdhanEnabled = !isAdhanEnabled;
        localStorage.setItem('adhanEnabled', isAdhanEnabled);
        this.classList.toggle('active', isAdhanEnabled);
        showNotification(isAdhanEnabled ? '🔔 المؤذن مفعل' : '🔕 المؤذن معطل', 'info');
        if (!isAdhanEnabled) hasAdhanPlayed = { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false };
    };
    document.getElementById('sound-toggle').onclick = function() {
        isSoundOn = !isSoundOn;
        localStorage.setItem('soundEnabled', isSoundOn);
        this.classList.toggle('active', isSoundOn);
        updateSoundIcon();
        if(isSoundOn) { adhanAudio.play().then(() => adhanAudio.pause()).catch(()=>{}); }
        showNotification(isSoundOn ? '🔊 الصوت مفعل' : '🔇 الصوت مكتوم', 'info');
    };
    document.getElementById('sound-btn').onclick = function() {
        isSoundOn = !isSoundOn;
        localStorage.setItem('soundEnabled', isSoundOn);
        document.getElementById('sound-toggle').classList.toggle('active', isSoundOn);
        updateSoundIcon();
        showNotification(isSoundOn ? '🔊 الصوت مفعل' : '🔇 الصوت مكتوم', 'info');
    };
    document.getElementById('adhan-voice').onchange = function() {
        currentVoice = this.value;
        localStorage.setItem('adhanVoice', currentVoice);
        updateAdhanVoice();
        showNotification(`🎤 تم تغيير صوت المؤذن`, 'info');
    };

    setTimeout(() => {
        if (!localStorage.getItem('firstVisit')) {
            showNotification('✨ مرحباً! يمكنك التحكم في الأذان من الأزرار أسفلاً', 'info');
            localStorage.setItem('firstVisit', 'true');
        }
    }, 1500);
    init();
    setInterval(updateCountdown, 1000);
    resetDailyFlags();
</script>
</body>
</html>
